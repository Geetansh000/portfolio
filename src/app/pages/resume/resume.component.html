<div class="resume-container">
  <div class="header">
    <h2>My Resume</h2>
    <a
      href="assets/Resume.pdf"
      download="Geetansh-Sharma-Resume.pdf"
      class="download-button"
    >
      Download
    </a>
  </div>

  <div class="pdf-preview" *ngIf="pdfBlobUrl">
    <object
      [data]="pdfBlobUrl"
      type="application/pdf"
      width="100%"
    >
      <p>
        Your browser doesn't support PDF preview.
        <a [href]="pdfBlobUrl">Download</a> instead.
      </p>
    </object>
  </div>
</div>
