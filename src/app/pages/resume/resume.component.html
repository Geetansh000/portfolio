<div class="resume-container mat-elevation-z2">
  <div class="header">
    <h2>My Resume</h2>
    <a
      href="assets/Resume.pdf"
      download="Geetansh-Sharma-Resume.pdf"
      mat-flat-button
      color="primary"
    >
      Download
    </a>
  </div>

  <object [data]="pdfUrl" type="application/pdf" class="pdf-viewer">
    <p>
      Your browser does not support PDF preview. Please click Download to
      download the resume.
    </p>
  </object>
</div>
