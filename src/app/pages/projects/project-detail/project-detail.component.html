<div
  class="project-detail"
  *ngIf="display && project"
>
  <div class="project-detail-container">
    <!-- Title -->
    <h1 class="project-title">{{ project.title }}</h1>

    <!-- Description as Tags -->
    <div class="description-tags-container">
      <div class="description-tag" *ngFor="let bullet of project.description">
        <span class="tag-icon" *ngIf="showIcons">💡</span> {{ bullet }}
      </div>
    </div>

    <!-- Cartoon Boy and Role -->
    <div class="role-tag">
      <img class="cartoon-boy" src="assets/cartoon-boy.png" alt="Cartoon Boy" />
      <div class="role-text">{{ project.role }}</div>
    </div>
  </div>

  <!-- Technologies Used -->
  <div class="tech-used-page">
    <h2 class="tech-title animate-fade-in">Technologies Used</h2>

    <div class="tech-category-grid">
      <div
        class="tech-category-card animate-slide-up"
        *ngFor="let category of techCategories"
      >
        <h3 class="category-title">{{ formatCategoryName(category) }}</h3>
        <div class="tech-list">
          <div
            class="tech-item"
            *ngFor="let tech of project.tech_skills?.[category] || []"
          >
            <ng-container *ngIf="getIconForTech(tech) as icon">
              <img [src]="icon" (error)="onImageError($event)" />
            </ng-container>
            <span>{{ tech }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
