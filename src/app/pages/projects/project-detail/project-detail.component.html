<div
  class="project-detail"
  *ngIf="display && project"
  [style.--accent]="project.color"
>
  <div class="pd-hero">
    <div class="pd-hero-inner">
      <div class="pd-hero-left">
        <span class="pd-eyebrow" *ngIf="project.type">{{ project.type }}</span>
        <h1 class="pd-title">{{ project.title }}</h1>
        <p class="pd-tagline" *ngIf="project.short_description">{{ project.short_description }}</p>
        <div class="pd-role-chip" *ngIf="project.role">
          <span class="pd-role-label">My Role</span>
          <span class="pd-role-value">{{ project.role }}</span>
        </div>
      </div>
      <div class="pd-hero-right">
        <div class="pd-icon-wrap">
          <img
            *ngIf="project.icon"
            [src]="project.icon"
            [alt]="project.title"
            class="pd-icon"
            (error)="onImageError($event)"
          />
          <span class="pd-icon-mono" *ngIf="!project.icon">{{ project.title?.charAt(0) }}</span>
        </div>
      </div>
    </div>
    <div class="pd-accent-bar"></div>
  </div>

  <section class="pd-section pd-overview">
    <div class="pd-section-inner">
      <h2 class="pd-section-heading">
        <span class="pd-section-num">01</span> Project Overview
      </h2>
      <ul class="pd-feature-list">
        <li class="pd-feature-item" *ngFor="let bullet of project.description; let i = index" [style.--i]="i">
          <span class="pd-feature-dot"></span>
          <p>{{ bullet }}</p>
        </li>
      </ul>
    </div>
  </section>

  <section class="pd-section pd-tech">
    <div class="pd-section-inner">
      <h2 class="pd-section-heading">
        <span class="pd-section-num">02</span> Tech Stack
      </h2>
      <div class="pd-tech-categories">
        <div
          class="pd-tech-category"
          *ngFor="let category of techCategories; let ci = index"
        >
          <h3 class="pd-category-name">{{ formatCategoryName(category) }}</h3>
          <div class="pd-tech-chips">
            <div
              class="pd-tech-chip"
              *ngFor="let tech of project.tech_skills?.[category] || []; let ti = index"
            >
              <img
                *ngIf="getIconForTech(tech)"
                [src]="getIconForTech(tech)"
                [alt]="tech"
                (error)="onImageError($event)"
                class="pd-chip-icon"
              />
              <span>{{ tech }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
