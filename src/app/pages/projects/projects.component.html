<div class="projects-section">
  <h2 class="section-title">My Projects</h2>

  <div
    class="projects-grid"
    #projectSlider
    (swipeleft)="scrollRight()"
    (swiperight)="scrollLeft()"
  >
    <mat-card
      *ngFor="let project of projects; let i = index"
      class="project-card"
      [ngClass]="{
        active: i === activeIndex,
        'blurred-left': i < activeIndex,
        'blurred-right': i > activeIndex
      }"
      (click)="viewProjectDetails(project)"
    >
      <div
        class="card-color-bar"
        [ngStyle]="{ 'background-color': project.color }"
      ></div>
      <div class="card-body">
        <img
          class="project-image"
          [src]="project.icon"
          alt="{{ project.title }}"
        />

        <mat-card-title>{{ project.title }}</mat-card-title>
        <mat-card-content>
          <p class="description">{{ project.short_description }}</p>
          <p class="role">
            {{ project.role }}
          </p>
          <p class="type">({{ project.type }})</p>
        </mat-card-content>
      </div>
    </mat-card>
  </div>

  <div class="slider-controls" *ngIf="projects.length > 1">
    <button (click)="scrollLeft()">&larr;</button>
    <button (click)="scrollRight()">&rarr;</button>
  </div>
</div>
