<div class="projects-section">
  <h2 class="section-title">My Projects</h2>

  <div
    [ngClass]="projects.length === 1 ? 'projects-grid-single' : 'projects-grid'"
    [ngStyle]="{ display: display ? 'flex' : 'none' }"
  >
    <mat-card
      *ngFor="let project of projects"
      class="project-card"
      (click)="viewProjectDetails(project)"
    >
      <div
        class="card-color-bar"
        [ngStyle]="{ 'background-color': project.color }"
      ></div>
      <div class="card-body">
        <img
          mat-card-image
          [src]="project.icon"
          class="project-image"
          alt="{{ project.title }}"
        />
        <mat-card-title>{{ project.title }}</mat-card-title>
        <mat-card-content>
          <p class="description">{{ project.short_description }}</p>
          <p class="role">
            {{ project.role }} <span>({{ project.type }})</span>
          </p>
        </mat-card-content>
      </div>
    </mat-card>
  </div>
</div>
