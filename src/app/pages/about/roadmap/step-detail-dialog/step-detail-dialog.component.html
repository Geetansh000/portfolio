  <!-- Step Details Popup -->
  <div *ngIf="showPopup" class="popup-overlay" (click)="closeDetails()">
    <div class="popup-content" (click)="$event.stopPropagation()">
      <div class="popup-meta">
        <div class="meta-left">
          <img
            *ngIf="step.icon"
            [src]="step.icon"
            [alt]="step.title + ' icon'"
            class="popup-icon"
            loading="lazy"
          />
          <h2>{{ step.title }}</h2>
        </div>

        <div class="meta-right">
          <span *ngIf="step.year" class="year-pill">{{ step.year }}</span>
          <span *ngIf="step.badge" class="badge-pill">{{ step.badge }}</span>
        </div>
      </div>

      <h3>{{ step.description }}</h3>
      <p class="long-description" [innerHTML]="getFormattedLongDescription()"></p>

      <div class="word-chips">
        <span class="chip" *ngFor="let word of step.strongWords">{{ word }}</span>
      </div>
      <!-- <button mat-raised-button color="primary" (click)="closeDetails()">
        Close
      </button> -->
    </div>
  </div>
</div>
