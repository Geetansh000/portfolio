<div class="roadmap-container">
  <div class="journey-headline">
    <h3>Career Journey Timeline</h3>
    <p>From academic excellence to production-grade engineering outcomes.</p>
  </div>

  <!-- Stepper Track -->
  <div class="stepper-track">


    <!-- Steps with Cards -->
    <div
      class="step-card"
      *ngFor="let step of steps; let i = index"
      [class.active]="currentStep === i"
      [class.left-card]="i % 2 === 0"
      [class.right-card]="i % 2 !== 0"
    >
      <mat-card class="milestone-card" (click)="goToStep(i)">
        <div class="step-marker">
          <span class="step-year">{{ step.year }}</span>
          <span class="step-badge">{{ step.badge }}</span>
        </div>
        <div class="step-head">
          <img class="step-icon" [src]="step.icon" [alt]="step.title + ' icon'" loading="lazy" />
          <h4 class="step-title">{{ step.title }}</h4>
        </div>
        <mat-card-content>
          <p>{{ step.description }}</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
