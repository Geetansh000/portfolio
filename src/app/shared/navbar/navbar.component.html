<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    [mode]="'over'"
    [opened]="isMobile && isSidenavOpen"
    [autoFocus]="false"
    (closedStart)="isSidenavOpen = false"
  >
    <div class="drawer-shell">
      <div class="drawer-header">
        <div class="drawer-brand">
          <span class="drawer-title">My Portfolio</span>
          <span class="drawer-subtitle">Backend Developer</span>
        </div>
        <button
          mat-icon-button
          class="drawer-close"
          aria-label="Close navigation menu"
          (click)="drawer.close(); isSidenavOpen = false"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <nav class="drawer-links" aria-label="Mobile navigation links">
        <a
          mat-button
          class="drawer-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="drawer.close()"
        >
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </a>

        <a mat-button class="drawer-link" routerLink="/about" routerLinkActive="active" (click)="drawer.close()">
          <mat-icon>info</mat-icon>
          <span>About</span>
        </a>

        <a mat-button class="drawer-link" routerLink="/projects" routerLinkActive="active" (click)="drawer.close()">
          <mat-icon>work</mat-icon>
          <span>Projects</span>
        </a>

        <a mat-button class="drawer-link" routerLink="/contact" routerLinkActive="active" (click)="drawer.close()">
          <mat-icon>mail</mat-icon>
          <span>Contact</span>
        </a>

        <a mat-button class="drawer-link" routerLink="/resume" routerLinkActive="active" (click)="drawer.close()">
          <mat-icon>description</mat-icon>
          <span>Resume</span>
        </a>
      </nav>

      <div class="drawer-footer">
        <span>Designing resilient APIs and scalable systems</span>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        mat-icon-button
        class="sidenav-toggle mobile-toggle"
        (click)="toggleSidenav(drawer)"
        [@rotateHamburger]="isSidenavOpen ? 'open' : 'closed'"
        aria-label="Open navigation menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div class="brand-wrap">
        <span class="title">My Portfolio</span>
        <span class="brand-chip">Crafted by Geetansh</span>
      </div>

      <span class="spacer"></span>

      <div class="navbar-links desktop-links" *ngIf="!isMobile">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Home
        </a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a routerLink="/resume" routerLinkActive="active">Resume</a>
      </div>

      <button
        mat-icon-button
        (click)="toggleTheme()"
        class="theme-toggle"
        matTooltip="Toggle Theme"
        aria-label="Toggle color theme"
      >
        <mat-icon>{{ isDarkTheme ? "dark_mode" : "light_mode" }}</mat-icon>
      </button>
    </mat-toolbar>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
