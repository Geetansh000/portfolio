<!-- <ng-container [class.hidden]="!isReady"> -->
<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav for mobile -->
  <mat-sidenav
    #drawer
    class="app-sidenav"
    [mode]="'over'"
    [opened]="isMobile && isSidenavOpen"
    (closedStart)="isSidenavOpen = false"
  >
    <nav class="drawer-links">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>

      <a
        mat-button
        routerLink="/about"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon>info</mat-icon>
        <span>About</span>
      </a>

      <a
        mat-button
        routerLink="/projects"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon>work</mat-icon>
        <span>Projects</span>
      </a>

      <a
        mat-button
        routerLink="/contact"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon>mail</mat-icon>
        <span>Contact</span>
      </a>

      <a
        mat-button
        routerLink="/resume"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon>description</mat-icon>
        <span>Resume</span>
      </a>
    </nav>
  </mat-sidenav>

  <!-- Toolbar + content -->
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <!-- Show hamburger only on mobile -->
      <button
        mat-icon-button
        class="sidenav-toggle mobile-links"
        (click)="toggleSidenav(drawer)"
        [@rotateHamburger]="isSidenavOpen ? 'open' : 'closed'"
        aria-label="Open navigation menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div class="brand-wrap">
        <span class="title">My Portfolio</span>
        <span class="brand-chip">Crafted by Geetansh</span>
      </div>

      <span class="spacer"></span>

      <!-- Desktop links -->
      <div class="navbar-links desktop-links" *ngIf="!isMobile">
        <a routerLink="/" routerLinkActive="active">Home</a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a routerLink="/resume" routerLinkActive="active">Resume</a>
      </div>

      <!-- Theme toggle -->
      <button
        mat-icon-button
        (click)="toggleTheme()"
        class="theme-toggle"
        matTooltip="Toggle Theme"
        aria-label="Toggle color theme"
      >
        <mat-icon>{{ isDarkTheme ? "dark_mode" : "light_mode" }}</mat-icon>
      </button>
    </mat-toolbar>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
<!-- </ng-container> -->
